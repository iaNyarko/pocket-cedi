<style>
/* Layout: single-column phone app, sticky header with a woven-stripe band, fixed bottom nav + floating add button, bottom sheets for entry. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --sunk:#E9EEE8; --ink:#14201A; --muted:#5B6A61; --line:#DCE3DC;
  --accent:#0D6A45; --accent-ink:#FFFFFF; --accent-soft:#DDEFE4; --gold:#C38D12;
  --ok:#2E8A57; --warn:#B26A00; --bad:#C2342B; --warn-soft:#FBEFD9; --bad-soft:#FBE3E0;
  --shadow:0 10px 30px -12px rgba(20,40,30,.35);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1310; --surface:#151D19; --sunk:#1C2621; --ink:#E5ECE7; --muted:#93A39A; --line:#26332C;
  --accent:#42C287; --accent-ink:#06150E; --accent-soft:#183A2A; --gold:#E2B24A;
  --ok:#5CCB8E; --warn:#E9A944; --bad:#F27766; --warn-soft:#3A2C12; --bad-soft:#3D1D19;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#151D19; --sunk:#1C2621; --ink:#E5ECE7; --muted:#93A39A; --line:#26332C;
  --accent:#42C287; --accent-ink:#06150E; --accent-soft:#183A2A; --gold:#E2B24A;
  --ok:#5CCB8E; --warn:#E9A944; --bad:#F27766; --warn-soft:#3A2C12; --bad-soft:#3D1D19;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:14px;display:flex;flex-direction:column;gap:10px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hrow{max-width:560px;width:100%;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.brand{white-space:nowrap}
.weave{height:5px;width:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 14px,var(--accent) 14px 22px,var(--bad) 22px 26px,var(--ink) 26px 30px,var(--gold) 30px 44px,var(--accent) 44px 48px)}
.period{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.period button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.period button:disabled{opacity:.3;cursor:default}
.period span{font-size:13px;font-weight:600;min-width:100px;text-align:center}
.mode{font-size:12px;color:var(--muted)}
.mode.nudge{background:var(--warn-soft);color:var(--warn);padding:8px 12px;border-radius:10px;font-weight:600;margin:0}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.hero .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.8;font-weight:600}
.hero .big{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.hero .big small{font-size:18px;font-weight:600;opacity:.8;margin-right:4px}
.meter{height:10px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.meter.over i{background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats span{font-size:12px;opacity:.8}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;font-size:14px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert b{font-weight:700}

section.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ch h2{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700}
.ch .sub{font-size:13px;color:var(--muted)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}

.cats{display:flex;flex-direction:column;gap:14px}
.cat{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center}
.dot{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;font-family:var(--f-display);grid-row:span 2}
.cat .nm{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat .amt{font-size:14px;text-align:right;white-space:nowrap}
.cat .amt em{font-style:normal;color:var(--muted);font-size:12px}
.bar{grid-column:2 / 4;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex;align-items:center}
.bar i{height:100%;border-radius:99px;display:block}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

.methods{display:flex;flex-wrap:wrap;gap:8px}
.mchip{display:flex;gap:8px;align-items:baseline;background:var(--sunk);border-radius:10px;padding:7px 10px;font-size:13px}
.mchip b{font-family:var(--f-display);font-variant-numeric:tabular-nums}

.day{display:flex;flex-direction:column;gap:2px}
.dayh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;padding:6px 2px}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 4px;border:0;background:none;text-align:left;width:100%;border-radius:10px}
.row:hover{background:var(--sunk)}
.row .t{min-width:0}
.row .t div{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--muted);font-size:12px}
.row .a{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot.sm{grid-row:auto}

.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:18px}

.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input[type=text],input[type=date],input[type=number],input[inputmode],select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.bgrid{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:28px 1fr 130px;gap:10px;align-items:center}
.brow .nm{font-weight:600;font-size:14px;min-width:0}
.brow .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.cedi-in{position:relative}
.cedi-in span{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.cedi-in input{padding-left:42px;text-align:right;font-family:var(--f-display);font-variant-numeric:tabular-nums}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btns{display:flex;gap:10px}
.btns .btn{flex:1}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
nav.tabs .in{max-width:560px;width:100%;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;gap:4px;align-items:center}
nav.tabs button{border:0;background:none;padding:8px 4px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px}
nav.tabs .fab{width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;font-weight:400;margin:-26px auto 0;box-shadow:var(--shadow);display:grid;place-items:center;line-height:1}

.scrim{position:fixed;inset:0;background:rgba(5,12,8,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h3{margin:0;font-family:var(--f-display);font-size:20px}
.amount-in{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--accent);padding-bottom:6px}
.amount-in span{font-family:var(--f-display);font-size:22px;color:var(--muted);font-weight:700}
.amount-in input{border:0;background:none;font-family:var(--f-display);font-size:40px;font-weight:800;width:100%;padding:0;min-width:0;font-variant-numeric:tabular-nums}
.amount-in input:focus{outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>*{min-width:0}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;font-size:14px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
.money .bal{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.neg{color:var(--bad)}
.wallets{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.wallet{background:var(--sunk);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wallet span{font-size:12px;color:var(--muted);font-weight:600}
.wallet b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet.neg b{color:var(--bad)}
.in-dot{background:var(--ok);font-size:16px}
.mv-dot{background:var(--muted);font-size:14px}
.row .a.in{color:var(--ok)}
.row .a.mv{color:var(--muted)}
button.cat{border:0;background:none;padding:4px 2px;width:100%;text-align:left;border-radius:10px}
button.cat:hover{background:var(--sunk)}
.subs{display:flex;flex-direction:column;gap:6px;margin:-6px 0 4px 38px;padding:10px 12px;background:var(--sunk);border-radius:12px}
.subrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.subrow span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subrow i{height:5px;border-radius:99px;background:var(--line);overflow:hidden;display:block}
.subrow i b{display:block;height:100%;border-radius:99px}
.quick{display:flex;flex-direction:column;gap:8px}
.quick h2{margin:0;font-family:var(--f-display);font-size:15px;font-weight:700}
.qrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.qrow::-webkit-scrollbar{display:none}
.qbtn{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600;max-width:240px}
.qbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbtn i{width:9px;height:9px;border-radius:50%;flex:none}
.qbtn b{color:var(--accent);flex:none}
.qbtn:active{transform:scale(.97)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:2px 4px}
.btns.three{display:grid;grid-template-columns:1.3fr 1fr .8fr;gap:8px}
.btns.three .btn{padding:11px 8px;font-size:14px}
.smsbtn{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px;font-weight:700;font-size:14px}
textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:inherit;font-size:14px;resize:vertical;min-height:120px}
.smscard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.smst{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.smsamt{font-size:28px;font-weight:800}
.smsamt.in{color:var(--ok)}
.smscard dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
.smscard dt{color:var(--muted)}
.smscard dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;font-weight:600}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.tagadd{display:flex;gap:8px}
.tagadd input{flex:1}
.addchip{border-style:dashed;color:var(--accent)}
.newsub{display:inline-flex;gap:6px;align-items:center}
.newsub input{width:130px;padding:7px 10px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tags span{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px}
.tagchip{border:0;color:var(--ink)}
.search input{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--sunk);border-radius:12px}
.qitem>div{min-width:0}
.qitem b{display:block;font-size:14px}
.qitem small{color:var(--muted);font-size:12px}
.toast{display:flex;gap:14px;align-items:center}
.toast button{border:0;background:none;color:var(--gold);font-weight:800;padding:0}
.loansum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.loansum div{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.loansum span{font-size:12px;color:var(--muted);font-weight:600}
.loansum b{font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap}
.inok{color:var(--ok)} .owe{color:var(--warn)}
.av{font-size:11px;letter-spacing:.02em}
.av-lent{background:var(--ok)} .av-borr{background:var(--warn)}
.dot.big{width:44px;height:44px;border-radius:14px;font-size:15px;grid-row:auto;flex:none}
.row .a.owe{color:var(--warn)}
.row .a small.of{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);text-align:right}
.pill.okp{background:var(--accent-soft);color:var(--accent)}
.loanhead{display:flex;gap:12px;align-items:center}
.loanhead b{display:block;font-size:15px}
.loanhead small{color:var(--muted);font-size:12px}
.loanfig{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.loanfig div{display:flex;flex-direction:column;min-width:0}
.loanfig span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.loanfig b{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter2{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter2 i{display:block;height:100%;background:var(--ok);border-radius:99px}
.payrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);font-size:14px}
.payrow:first-child{border-top:0}
.loanhint{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.btn.sm2{padding:9px 12px;font-size:14px;align-self:flex-start}
.brandrow{display:flex;align-items:center;gap:8px}
.helpbtn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:15px;color:var(--muted);flex:none;line-height:1}
.guide{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;justify-content:center;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.guide .gin{max-width:460px;width:100%;display:flex;flex-direction:column;gap:18px;min-height:100%}
.gtop{display:flex;justify-content:space-between;align-items:center}
.gdots{display:flex;gap:6px}
.gdots i{width:8px;height:8px;border-radius:99px;background:var(--line);display:block;transition:width .2s}
.gdots i.on{width:22px;background:var(--accent)}
.gskip{border:0;background:none;color:var(--muted);font-weight:700;font-size:14px;padding:6px}
.gart{margin-top:6vh;width:120px;height:120px;border-radius:34px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:var(--shadow);position:relative;overflow:hidden}
.gart::after{content:"";position:absolute;left:0;right:0;bottom:14px;height:7px;background:repeating-linear-gradient(90deg,var(--gold) 0 12px,#fff 12px 18px,var(--bad) 18px 21px,#14201A 21px 24px)}
.gart svg{width:56px;height:56px}
.gstep{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.guide h2{margin:-8px 0 0;font-family:var(--f-display);font-size:28px;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.guide p{margin:0;font-size:16px;line-height:1.55;color:var(--ink);max-width:40ch}
.gtip{background:var(--sunk);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted)}
.gtip b{color:var(--ink)}
.gfoot{margin-top:auto;display:flex;gap:10px}
.gfoot .btn{flex:1;padding:14px}
.faq details{border-top:1px solid var(--line);padding:10px 0}
.faq details:first-of-type{border-top:0}
.faq summary{font-weight:700;font-size:14px;cursor:pointer}
.faq details p{margin:8px 0 0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.gpane{animation:gin .25s ease-out}}
@keyframes gin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.vidcard{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:14px;padding:10px}
.vidcard .th{position:relative;width:72px;aspect-ratio:9/19.5;max-width:100%;border-radius:10px;overflow:hidden;background:#000}
.vidcard .th img{width:100%;height:100%;object-fit:cover;display:block}
.vidcard .th i{position:absolute;inset:0;display:grid;place-items:center}
.vidcard .th i::before{content:"";width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.vidcard .th i::after{content:"";position:absolute;border-left:10px solid var(--accent);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.vidcard b{display:block;font-size:15px}
.vidcard small{color:var(--muted);font-size:13px}
.vidov{position:fixed;inset:0;z-index:60;background:rgba(5,10,7,.94);display:flex;align-items:center;justify-content:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.vidov video{max-width:100%;max-height:100%;border-radius:16px;background:#000}
.vidov button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));border:0;border-radius:999px;padding:9px 16px;font-weight:800;background:#fff;color:#14201A}
</style>
</head>
<body>


<header>
  <div class="hrow">
    <div class="brandrow"><div class="brand">Pocket <span>Cedi</span></div><button class="helpbtn" id="helpBtn" aria-label="How to use Pocket Cedi">?</button></div>
    <div class="period" aria-label="Pay period">
      <button id="prev" aria-label="Previous period">‹</button>
      <span id="plabel" class="num">…</span>
      <button id="next" aria-label="Next period">›</button>
    </div>
  </div>
  <div class="weave" aria-hidden="true"></div>
</header>

<main class="wrap" id="main" style="padding-top:14px"></main>

<nav class="tabs" aria-label="Sections">
  <div class="in">
    <button data-tab="overview" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Overview</button>
    <button data-tab="entries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Entries</button>
    <button class="fab" id="fab" aria-label="Add spending">+</button>
    <button data-tab="loans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Loans</button>
    <button data-tab="budgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1.4-1.3-2-3-2s-3 .8-3 2.2c0 3 6 1.5 6 4.6 0 1.4-1.3 2.2-3 2.2s-3-.7-3-2"/></svg>Budgets</button>
  </div>
</nav>

<div id="sheetHost"></div>
<div id="toastHost"></div>

<script>
(function(){
const CATS=[
 {id:'transport',name:'Transport',hint:'Trotro, taxi, Bolt/Uber, fuel',c:'#2F7DD1',ab:'TR',subs:['Trotro','Taxi','Bolt/Uber/Yango','Okada','Fuel']},
 {id:'food',name:'Food & chop money',hint:'Lunch, waakye, market, groceries',c:'#D9822B',ab:'FD',subs:['Breakfast','Lunch','Supper','Snacks & drinks','Market & groceries','Eating out']},
 {id:'data',name:'Data & airtime',hint:'Bundles and airtime',c:'#8B5CF6',ab:'DA',subs:['Data bundle','Airtime']},
 {id:'utilities',name:'Utilities',hint:'ECG prepaid, water, gas',c:'#0E9F9E',ab:'UT',subs:['ECG prepaid','Water','Gas','Waste collection']},
 {id:'rent',name:'Rent & housing',hint:'Rent, repairs, household',c:'#64748B',ab:'RH',subs:['Rent','Repairs','Household items']},
 {id:'family',name:'Family support',hint:'Money sent home',c:'#DB2777',ab:'FS',subs:['Parents','Siblings','Extended family']},
 {id:'church',name:'Church & giving',hint:'Tithe, offering, donations',c:'#A16207',ab:'CG',subs:['Tithe','Offering','Donation','Funerals & events']},
 {id:'school',name:'School fees',hint:'Fees, books, uniforms',c:'#4F46E5',ab:'SF',subs:['Fees','Books','Uniform']},
 {id:'susu',name:'Susu & savings',hint:'Susu, savings, investments',c:'#16A34A',ab:'SS',subs:['Susu','Savings','Investment']},
 {id:'health',name:'Health',hint:'Pharmacy, clinic, NHIS',c:'#DC2626',ab:'HE',subs:['Pharmacy','Clinic/hospital','NHIS']},
 {id:'personal',name:'Personal & clothing',hint:'Clothes, barber, salon',c:'#7C8B2E',ab:'PC',subs:['Clothes','Barber/salon','Toiletries']},
 {id:'other',name:'Other',hint:'Fees and anything else',c:'#78716C',ab:'OT',subs:['MoMo & bank fees','Other']},
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const METHODS=[{id:'cash',name:'Cash'},{id:'mtn',name:'MTN MoMo'},{id:'telecel',name:'Telecel Cash'},{id:'at',name:'AT Money'},{id:'card',name:'Bank / card'}];
const METH=Object.fromEntries(METHODS.map(m=>[m.id,m]));
const SOURCES=[{id:'salary',name:'Salary'},{id:'opening',name:'Money I already have'},{id:'other',name:'Other income'}];
const SRC=Object.fromEntries(SOURCES.map(s=>[s.id,s]));

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('en-GH',{maximumFractionDigits:0});
const cedi=p=>(p<0?'−':'')+'GH₵ '+nf.format(Math.abs(p||0)/100);
const cediShort=p=>{const v=Math.abs(p||0)/100;return (p<0?'−':'')+'GH₵ '+(v>=1000||v%1===0?nf0.format(v):nf.format(v));};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtD=d=>d.getDate()+' '+MON[d.getMonth()];
const toPes=v=>{const n=Number(String(v).replace(/[^0-9.]/g,''));return isFinite(n)?Math.round(n*100):0;};
const titleCase=s=>s.toLowerCase().replace(/\b([a-z])/g,m=>m.toUpperCase());
const normTag=t=>String(t||'').trim().toLowerCase().replace(/^#/,'').replace(/[^a-z0-9 _-]/g,'').replace(/\s+/g,'-').slice(0,24);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function periodFor(payDay,offset){
  const t=new Date();t.setHours(0,0,0,0);
  let y=t.getFullYear(),m=t.getMonth();
  if(t.getDate()<payDay) m-=1;
  m+=offset;
  const start=new Date(y,m,payDay), end=new Date(y,m+1,payDay);
  return {start:ymd(start),end:ymd(end),s:start,e:end,days:Math.round((end-start)/864e5)};
}

/* ---------- state ---------- */
const DEF_SETTINGS={payDay:1,budgets:{},quick:[],subcats:{}};
const state={tab:'overview',offset:0,settings:Object.assign({},DEF_SETTINGS),exp:[],money:[],loans:[],ready:false,mode:'pending',open:{},search:''};
const subsFor=cat=>(CAT[cat]?.subs||[]).concat(state.settings.subcats[cat]||[]);
const allTags=()=>{const s=new Set();for(const e of state.exp)(e.tags||[]).forEach(t=>s.add(t));return [...s].sort();};

/* ---------- storage: private claude.ai store, else this device ---------- */
const S={exp:null,money:null,loans:null,setRef:null,downloads:null};
const LK='pocketcedi.v1';
const mem={settings:null,items:[],money:[],loans:[]};
let localOK=true;try{localStorage.setItem(LK+'.t','1');localStorage.removeItem(LK+'.t');}catch(e){localOK=false;}
const L={get(){if(!localOK)return mem;try{const o=JSON.parse(localStorage.getItem(LK))||{};o.items=o.items||[];o.money=o.money||[];o.loans=o.loans||[];return o;}catch(e){return {settings:null,items:[],money:[],loans:[]};}},
  put(o){if(localOK){try{localStorage.setItem(LK,JSON.stringify(o));}catch(e){}}else Object.assign(mem,o);}};

function applySettings(s){
  const prev=state.settings.payDay;
  s=s||{};
  state.settings={payDay:Math.min(28,Math.max(1,Number(s.payDay)||1)),budgets:Object.assign({},s.budgets||{}),
    quick:Array.isArray(s.quick)?s.quick.slice():[],subcats:Object.assign({},s.subcats||{})};
  return prev!==state.settings.payDay;
}
function loadLocal(){const o=L.get();state.exp=o.items.map(x=>Object.assign({},x));state.money=o.money.map(x=>Object.assign({},x));state.loans=(o.loans||[]).map(x=>Object.assign({},x));state.ready=true;render();}

// kind: 'exp' | 'money'; resolves the id
async function saveDoc(kind,id,data){
  if(state.mode==='db'){const col=kind==='exp'?S.exp:kind==='loan'?S.loans:S.money;if(id){await col.doc(id).set(data);return id;}const ref=col.doc();await ref.set(data);return ref.id;}
  const o=L.get();o.loans=o.loans||[];const arr=kind==='exp'?o.items:kind==='loan'?o.loans:o.money;let nid=id;
  if(id){const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=Object.assign({id},data);}else{nid='l'+uid();arr.push(Object.assign({id:nid},data));}
  L.put(o);loadLocal();return nid;
}
async function deleteDoc(kind,id){
  if(state.mode==='db'){await (kind==='exp'?S.exp:kind==='loan'?S.loans:S.money).doc(id).delete();return;}
  const o=L.get();if(kind==='exp')o.items=o.items.filter(x=>x.id!==id);else if(kind==='loan')o.loans=(o.loans||[]).filter(x=>x.id!==id);else o.money=o.money.filter(x=>x.id!==id);L.put(o);loadLocal();
}
async function saveSettings(patch){
  const s=Object.assign({},state.settings,patch);
  if(state.mode==='db'){await S.setRef.set(s);return;}
  const o=L.get();o.settings=s;L.put(o);if(applySettings(s))state.offset=0;render();
}

async function init(){
  state.mode='local';applySettings(L.get().settings);loadLocal();
  let toured=false;try{toured=!!localStorage.getItem(GK);}catch(e){}
  if(!toured&&!(state.exp.length+state.money.length+state.loans.length))openGuide(0);
  $('#helpBtn').onclick=()=>openGuide(0);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
}

/* ---------- toast (with optional action) ---------- */
let tt;
function toast(msg,action){
  const h=$('#toastHost');
  h.innerHTML='<div class="toast" role="status"><span>'+esc(msg)+'</span>'+(action?'<button type="button" id="toastAct">'+esc(action.label)+'</button>':'')+'</div>';
  if(action)$('#toastAct').onclick=()=>{h.innerHTML='';action.fn();};
  clearTimeout(tt);tt=setTimeout(()=>h.innerHTML='',action?5500:2600);
}

/* ---------- computed ---------- */
function walletBalances(){
  const wal={};const W=k=>{if(wal[k]===undefined)wal[k]=0;};
  for(const m of state.money){const a=m.amount||0;if(m.kind==='in'){W(m.to);wal[m.to]+=a;}else if(m.kind==='move'){W(m.from);W(m.to);wal[m.from]-=a;wal[m.to]+=a;}}
  for(const e of state.exp){W(e.method);wal[e.method]-=e.amount||0;}
  for(const l of state.loans){const a=l.amount||0,sgn=l.dir==='lent'?-1:1;W(l.wallet);wal[l.wallet]+=sgn*a;for(const p of (l.payments||[])){W(p.wallet);wal[p.wallet]-=sgn*(p.amount||0);}}
  return wal;
}
function compute(){
  const p=periodFor(state.settings.payDay,state.offset);
  const inP=x=>x.date>=p.start&&x.date<p.end;
  const items=state.exp.filter(inP), moneyP=state.money.filter(inP);
  const byCat={},bySub={},byMeth={},byDay={},byTag={};let total=0;
  for(const x of items){const a=x.amount||0;total+=a;byCat[x.cat]=(byCat[x.cat]||0)+a;byMeth[x.method]=(byMeth[x.method]||0)+a;byDay[x.date]=(byDay[x.date]||0)+a;
    const sk=x.cat+'|'+(x.sub||'');bySub[sk]=(bySub[sk]||0)+a;for(const t of (x.tags||[]))byTag[t]=(byTag[t]||0)+a;}
  let received=0;for(const m of moneyP)if(m.kind==='in'&&m.source!=='opening')received+=m.amount||0;
  const wal=walletBalances();let balance=0;for(const k in wal)balance+=wal[k];
  const budgets=state.settings.budgets;let budgetTotal=0;for(const k in budgets)budgetTotal+=budgets[k]||0;
  const today=new Date();today.setHours(0,0,0,0);
  const isCurrent=state.offset===0;
  const daysLeft=isCurrent?Math.max(1,Math.round((p.e-today)/864e5)):0;
  return {p,items,moneyP,byCat,bySub,byMeth,byDay,byTag,total,received,wal,balance,hasMoney:state.money.length>0,budgetTotal,daysLeft,isCurrent,today};
}

/* ---------- render ---------- */
function render(){
  const c=compute();
  $('#plabel').textContent=fmtD(c.p.s)+' – '+fmtD(addDays(c.p.e,-1));
  $('#next').disabled=state.offset>=0;
  $$('nav.tabs [data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===state.tab?'page':'false'));
  const m=$('#main');
  if(state.tab==='overview')m.innerHTML=overview(c);
  else if(state.tab==='entries'){m.innerHTML=entries(c);wireSearch();}
  else if(state.tab==='loans')m.innerHTML=loansView();
  else{m.innerHTML=budgetsView(c);wireBudgets();}
}
function modeNote(){
  if(state.mode==='pending'||!state.ready)return '<p class="mode">Loading your spending…</p>';
  if(state.mode==='local'){const lb=lastBackup(),has=state.exp.length+state.money.length+state.loans.length>0;
    if(has&&(!lb||Date.now()-lb>7*864e5))return '<p class="mode nudge">'+(lb?'Your last backup was '+Math.floor((Date.now()-lb)/864e5)+' days ago.':'Your entries are saved on this phone only.')+' <button class="linkbtn" data-act="backup">Back up now</button></p>';}
  return '';
}

function quickStrip(){
  const q=state.settings.quick;
  let h='<section class="quick" aria-label="Quick add"><div class="ch"><h2>Quick add</h2>'+(q.length?'<button class="linkbtn" data-act="editquick">Edit</button>':'')+'</div>';
  if(!q.length)h+='<p class="note" style="margin:0">Spends you repeat, like your daily trotro, can be one tap. When adding one, tick “Save as a quick button”.</p>';
  else h+='<div class="qrow">'+q.map(b=>{const cat=CAT[b.cat]||CAT.other;return '<button class="qbtn" data-quick="'+esc(b.id)+'"><i style="background:'+cat.c+'"></i><span>'+esc(b.label)+'</span><b class="num">'+cediShort(b.amount)+'</b></button>';}).join('')+'</div>';
  return h+'</section>';
}

function moneyCard(c){
  let h='<section class="card money"><div class="ch"><h2>Your money now</h2>'+(c.hasMoney?'<span class="sub">All wallets</span>':'')+'</div>';
  if(!c.hasMoney){
    h+='<p class="note" style="margin:0">Add the cash and MoMo you have right now as your starting point. Add your salary when it lands. Pocket Cedi then shows what is left in each wallet as you spend.</p>';
  }else{
    h+='<div class="bal num'+(c.balance<0?' neg':'')+'">'+cedi(c.balance)+'</div>';
    const ws=METHODS.filter(x=>c.wal[x.id]!==undefined&&(c.wal[x.id]!==0||state.money.some(m=>m.to===x.id||m.from===x.id)));
    if(ws.length)h+='<div class="wallets">'+ws.map(x=>'<div class="wallet'+(c.wal[x.id]<0?' neg':'')+'"><span>'+esc(x.name)+'</span><b class="num">'+cedi(c.wal[x.id])+'</b></div>').join('')+'</div>';
    if(ws.some(x=>c.wal[x.id]<0))h+='<p class="note" style="margin:0;color:var(--bad)">A wallet below zero usually means some money in wasn’t recorded. Add it as “Money I already have”.</p>';
    if(c.received)h+='<p class="note" style="margin:0">Received this period: <b class="num" style="color:var(--ok)">'+cedi(c.received)+'</b></p>';
  }
  h+='<div class="btns three"><button class="btn" data-act="sms">Paste SMS</button><button class="btn ghost" data-act="in">+ Money in</button><button class="btn ghost" data-act="move">Move</button></div></section>';
  return h;
}

function overview(c){
  const b=c.budgetTotal, left=b-c.total, pct=b?Math.min(100,c.total/b*100):0;
  let hero='<div class="hero"><div><div class="lbl">Spent this pay period</div><div class="big num"><small>GH₵</small>'+nf.format(c.total/100)+'</div></div>';
  const prePay=c.isCurrent&&!state.money.some(m=>m.kind==='in'&&m.source==='salary');
  if(prePay){
    const perDay=c.balance>0?Math.floor(c.balance/c.daysLeft):0;
    hero+='<div class="stats"><div><b>'+cediShort(c.balance)+'</b><span>Money you have</span></div><div><b>'+cediShort(perDay)+'</b><span>Per day · '+c.daysLeft+' day'+(c.daysLeft===1?'':'s')+' to pay day</span></div><div><b>'+fmtD(c.p.e)+'</b><span>Next pay day</span></div></div>';
    hero+='<div style="font-size:13px;opacity:.92">'+(b?'Your '+cediShort(b)+' monthly budget starts when your first salary lands. ':'')+'Until then, this shows how far the money you have needs to stretch. When you’re paid, tap + Money in → Salary.</div>';
  }else if(b){
    hero+='<div class="meter'+(c.total>b?' over':'')+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>';
    hero+='<div class="stats"><div><b>'+cediShort(b)+'</b><span>Budget</span></div>';
    hero+='<div><b>'+cediShort(Math.abs(left))+'</b><span>'+(left<0?'Over budget':'Left in budget')+'</span></div>';
    if(c.isCurrent)hero+='<div><b>'+(left>0?cediShort(Math.floor(left/c.daysLeft)):'GH₵ 0.00')+'</b><span>Per day · '+c.daysLeft+' day'+(c.daysLeft===1?'':'s')+' left</span></div>';
    else hero+='<div><b>'+Object.keys(c.byDay).length+'</b><span>Days with spending</span></div>';
    hero+='</div>';
  }else hero+='<div style="font-size:14px;opacity:.9">Set budgets to see what is left for the rest of the period.</div>';
  hero+='</div>';

  const alerts=[];
  for(const cat of CATS){const bud=state.settings.budgets[cat.id];if(!bud)continue;const s=c.byCat[cat.id]||0;
    if(s>bud)alerts.push('<div class="alert bad"><b>'+esc(cat.name)+'</b> is over budget by '+cedi(s-bud)+'</div>');
    else if(s>=bud*.8)alerts.push('<div class="alert warn"><b>'+esc(cat.name)+'</b>: '+cedi(s)+' of '+cedi(bud)+' used</div>');}
  for(const l of openLoans())if(dueState(l)==='over')alerts.push('<div class="alert warn"><span>'+(l.dir==='lent'?'<b>'+esc(l.person)+'</b> owes you '+cedi(owedOf(l)):'You owe <b>'+esc(l.person)+'</b> '+cedi(owedOf(l)))+'. It was due '+fmtD(parse(l.due))+'.</span></div>');

  let html=modeNote()+(c.isCurrent?quickStrip():'')+hero+moneyCard(c);
  html+=loansCard();
  if(!c.items.length&&state.ready)return html+(alerts.length?'<div class="alerts">'+alerts.join('')+'</div>':'')+'<section class="card"><div class="empty"><strong>No spending logged this period</strong>Tap the green + button to add what you spent: trotro fare, lunch, data, anything.</div></section>';
  html+=(alerts.length?'<div class="alerts">'+alerts.join('')+'</div>':'');
  html+='<section class="card"><div class="ch"><h2>Day by day</h2><span class="sub">'+(c.isCurrent?'Today highlighted':'Past period')+'</span></div>'+dailyChart(c)+'</section>';

  const used=CATS.filter(x=>c.byCat[x.id]||state.settings.budgets[x.id]).sort((a,b)=>(c.byCat[b.id]||0)-(c.byCat[a.id]||0));
  html+='<section class="card"><div class="ch"><h2>By category</h2><span class="sub">Tap for detail</span></div><div class="cats">';
  for(const cat of used){
    const s=c.byCat[cat.id]||0,bud=state.settings.budgets[cat.id]||0,open=!!state.open[cat.id];
    let pill='',w,col=cat.c;
    if(bud){w=Math.min(100,s/bud*100);if(s>bud){pill='<span class="pill bad">Over</span>';col='var(--bad)';}else if(s>=bud*.8){pill='<span class="pill warn">Near limit</span>';col='var(--warn)';}}
    else w=c.total?s/c.total*100:0;
    html+='<button class="cat" data-open="'+cat.id+'" aria-expanded="'+open+'"><div class="dot" style="background:'+cat.c+'">'+cat.ab+'</div><div class="nm">'+esc(cat.name)+pill+'</div><div class="amt num">'+cedi(s)+(bud?' <em>/ '+cediShort(bud)+'</em>':'')+'</div><div class="bar"><i style="width:'+w.toFixed(1)+'%;background:'+col+'"></i></div></button>';
    if(open&&s){
      const rows=Object.keys(c.bySub).filter(k=>k.startsWith(cat.id+'|')).map(k=>({n:k.slice(cat.id.length+1)||'Not split',v:c.bySub[k]})).sort((a,b)=>b.v-a.v);
      html+='<div class="subs">'+rows.map(r=>'<div class="subrow"><span>'+esc(r.n)+'</span><i><b style="width:'+(r.v/s*100).toFixed(1)+'%;background:'+cat.c+'"></b></i><span class="num">'+cedi(r.v)+'</span></div>').join('')+'</div>';
    }
  }
  html+='</div></section>';

  const tags=Object.keys(c.byTag).sort((a,b)=>c.byTag[b]-c.byTag[a]);
  if(tags.length)html+='<section class="card"><div class="ch"><h2>By tag</h2><span class="sub">Tap to see entries</span></div><div class="methods">'+tags.map(t=>'<button class="mchip tagchip" data-tag="'+esc(t)+'">#'+esc(t)+' <b>'+cedi(c.byTag[t])+'</b></button>').join('')+'</div></section>';

  const ms=METHODS.filter(x=>c.byMeth[x.id]);
  if(ms.length)html+='<section class="card"><div class="ch"><h2>How you paid</h2><span class="sub">This period</span></div><div class="methods">'+ms.map(x=>'<div class="mchip">'+esc(x.name)+' <b>'+cedi(c.byMeth[x.id])+'</b></div>').join('')+'</div></section>';
  return html;
}

function dailyChart(c){
  const W=340,H=130,padL=4,padB=18,padT=14;
  const n=c.p.days,vals=[];let max=0;
  for(let i=0;i<n;i++){const d=ymd(addDays(c.p.s,i));const v=c.byDay[d]||0;vals.push({d,v});if(v>max)max=v;}
  const top=max||1, bw=(W-padL*2)/n, todayS=ymd(c.today);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spending per day this period">';
  s+='<line x1="0" x2="'+W+'" y1="'+(H-padB)+'" y2="'+(H-padB)+'" stroke="var(--line)"/>';
  vals.forEach((o,i)=>{const h=o.v?Math.max(2,(o.v/top)*(H-padB-padT)):0;const x=padL+i*bw+bw*.15;const isT=o.d===todayS;
    if(isT)s+='<rect x="'+(padL+i*bw)+'" y="'+padT/2+'" width="'+bw+'" height="'+(H-padB-padT/2)+'" fill="var(--accent-soft)" rx="3"/>';
    if(h)s+='<rect x="'+x.toFixed(1)+'" y="'+(H-padB-h).toFixed(1)+'" width="'+(bw*.7).toFixed(1)+'" height="'+h.toFixed(1)+'" rx="2" fill="'+(isT?'var(--accent)':'var(--muted)')+'" opacity="'+(isT?1:.55)+'"><title>'+fmtD(parse(o.d))+': '+cedi(o.v)+'</title></rect>';});
  const label=(i,anchor)=>'<text x="'+(padL+i*bw+bw/2).toFixed(1)+'" y="'+(H-4)+'" text-anchor="'+anchor+'">'+fmtD(parse(vals[i].d))+'</text>';
  s+=label(0,'start')+label(Math.floor(n/2),'middle')+label(n-1,'end');
  if(max){const mi=vals.findIndex(o=>o.v===max);const mx=padL+mi*bw+bw/2;s+='<text x="'+Math.min(W-2,Math.max(2,mx)).toFixed(1)+'" y="10" text-anchor="'+(mi<n*.2?'start':mi>n*.8?'end':'middle')+'" style="font-weight:600">'+cediShort(max)+'</text>';}
  return s+'</svg>';
}

/* ---------- entries + search ---------- */
function matches(r,q){
  if(!q)return true;
  if(q.startsWith('#')){const t=normTag(q);return r.t==='exp'&&(r.x.tags||[]).includes(t);}
  const x=r.x,ql=q.toLowerCase();
  if(r.t==='loan')return [x.l.person,x.l.payee,x.l.note,'loan',x.l.dir,x.p?'repaid paid back':''].join(' ').toLowerCase().includes(ql);
  const hay=r.t==='exp'?[x.note,x.payee,x.sub,(CAT[x.cat]||CAT.other).name,METH[x.method]?.name,(x.tags||[]).join(' ')]
    :[x.note,x.kind==='in'?(SRC[x.source]||SRC.other).name:'moved',METH[x.to]?.name,METH[x.from]?.name];
  return hay.join(' ').toLowerCase().includes(ql);
}
function entries(c){
  let h=modeNote()+'<div class="search"><input type="search" id="q" placeholder="Search: bolt, lunch, #work…" value="'+esc(state.search)+'" aria-label="Search entries"></div>';
  h+='<div id="elist">'+entriesList(c)+'</div>';
  h+='<button class="btn ghost block" id="exportBtn">Export all entries (CSV)</button>';
  return h;
}
function entriesList(c){
  const q=state.search.trim();
  const inP=d=>d>=c.p.start&&d<c.p.end,lr=[];
  for(const l of state.loans){if(inP(l.date))lr.push({t:'loan',x:{date:l.date,createdAt:l.createdAt,l}});for(const p of (l.payments||[]))if(inP(p.date))lr.push({t:'loan',x:{date:p.date,createdAt:p.createdAt,l,p}});}
  const all=c.items.map(x=>({t:'exp',x})).concat(c.moneyP.map(x=>({t:'money',x}))).concat(lr).filter(r=>matches(r,q));
  if(!all.length)return '<section class="card"><div class="empty"><strong>'+(q?'No matches in this period':'Nothing in this period')+'</strong>'+(q?'Try another word, or use ‹ at the top to search an earlier period.':'Spending and money in that you add will show here, grouped by day. Tap one to change or delete it.')+'</div></section>';
  const spent=all.reduce((a,r)=>a+(r.t==='exp'?(r.x.amount||0):0),0), rec=all.reduce((a,r)=>a+(r.t==='money'&&r.x.kind==='in'?(r.x.amount||0):0),0);
  const groups={};for(const r of all)(groups[r.x.date]=groups[r.x.date]||[]).push(r);
  let h='<section class="card" style="gap:6px"><div class="ch"><h2>'+(q?all.length+' match'+(all.length===1?'':'es'):all.length+' entr'+(all.length===1?'y':'ies'))+'</h2><span class="sub num">Spent '+cedi(spent)+(rec?' · In '+cedi(rec):'')+'</span></div>';
  for(const d of Object.keys(groups).sort().reverse()){
    const dt=parse(d),tot=groups[d].reduce((a,r)=>a+(r.t==='exp'?(r.x.amount||0):0),0);
    const label=d===ymd(c.today)?'Today':d===ymd(addDays(c.today,-1))?'Yesterday':DOW[dt.getDay()]+' '+fmtD(dt);
    h+='<div class="day"><div class="dayh"><span>'+label+'</span><span class="num">'+(tot?cedi(tot):'')+'</span></div>';
    for(const r of groups[d].sort((a,b)=>(b.x.createdAt||0)-(a.x.createdAt||0))){
      const x=r.x;
      if(r.t==='exp'){
        const cat=CAT[x.cat]||CAT.other;
        const meta=[x.note?(x.sub||cat.name):(x.sub?cat.name:''),METH[x.method]?.name].filter(Boolean).join(' · ');
        h+='<button class="row" data-edit="'+esc(x.id)+'"><div class="dot sm" style="background:'+cat.c+'">'+cat.ab+'</div><div class="t"><div>'+esc(x.note||x.sub||cat.name)+'</div><small>'+esc(meta)+'</small>'+((x.tags||[]).length?'<span class="tags">'+x.tags.map(t=>'<span>#'+esc(t)+'</span>').join('')+'</span>':'')+'</div><div class="a">'+cedi(x.amount)+'</div></button>';
      }else if(r.t==='loan'){
        const l=x.l,lent=l.dir==='lent',pp=x.p;
        const title=pp?(lent?l.person+' paid you back':'You paid back '+l.person):(lent?'Lent to '+l.person:'Borrowed from '+l.person);
        const meta='Loan · '+(pp?(lent?'into ':'from '):(lent?'from ':'into '))+(METH[pp?pp.wallet:l.wallet]?.name||'');
        const amt=pp?pp.amount:l.amount,incoming=pp?lent:!lent;
        h+='<button class="row" data-loan="'+esc(l.id)+'"><div class="dot sm av '+(lent?'av-lent':'av-borr')+'">'+esc(initials(l.person))+'</div><div class="t"><div>'+esc(title)+'</div><small>'+esc(meta)+'</small></div><div class="a '+(incoming?'in':'mv')+'">'+(incoming?'+':'−')+cedi(amt)+'</div></button>';
      }else if(x.kind==='in'){
        const src=SRC[x.source]||SRC.other;
        h+='<button class="row" data-money="'+esc(x.id)+'"><div class="dot sm in-dot">+</div><div class="t"><div>'+esc(x.note||src.name)+'</div><small>'+esc((x.note?src.name+' · ':'')+'into '+(METH[x.to]?.name||''))+'</small></div><div class="a in">+'+cedi(x.amount)+'</div></button>';
      }else{
        h+='<button class="row" data-money="'+esc(x.id)+'"><div class="dot sm mv-dot">⇄</div><div class="t"><div>'+esc(x.note||'Moved money')+'</div><small>'+esc((METH[x.from]?.name||'')+' → '+(METH[x.to]?.name||''))+'</small></div><div class="a mv">'+cedi(x.amount)+'</div></button>';
      }
    }
    h+='</div>';
  }
  return h+'</section>';
}

async function applyBalance(opts,walBefore,delta,date){
  if(!opts||opts.smsBal==null||!$('#adjust')||!$('#adjust').checked)return;
  const diff=opts.smsBal-((walBefore[opts.smsWallet]||0)+delta);
  if(Math.abs(diff)<1)return;
  if(diff>0)await saveDoc('money',null,{kind:'in',amount:diff,source:'other',to:opts.smsWallet,note:'Balance correction from SMS',date,createdAt:Date.now()});
  else await saveDoc('exp',null,{amount:-diff,cat:'other',sub:'Other',method:opts.smsWallet,note:'Unrecorded spending (balance correction)',date,createdAt:Date.now()});
}

/* ---------- MoMo SMS reader ---------- */
const KEYWORDS=[
  [/\bbolt\b|uber|yango|\bride\b/i,'transport','Bolt/Uber/Yango'],[/trotro|tro-tro/i,'transport','Trotro'],[/taxi/i,'transport','Taxi'],[/okada/i,'transport','Okada'],
  [/fuel|petrol|diesel|goil|shell|totalenergies|star oil|\bzen\b/i,'transport','Fuel'],
  [/data|bundle|internet|broadband/i,'data','Data bundle'],[/airtime|top-?up|recharge/i,'data','Airtime'],
  [/\becg\b|electricity|prepaid|power|npower|ndpower/i,'utilities','ECG prepaid'],[/water|gwcl|ghana water/i,'utilities','Water'],[/\bgas\b|lpg/i,'utilities','Gas'],[/zoomlion|waste|refuse/i,'utilities','Waste collection'],
  [/tithe/i,'church','Tithe'],[/offering|church|chapel|ministr/i,'church','Offering'],[/funeral|wedding|outdooring/i,'church','Funerals & events'],
  [/school|fees|tuition|university|college/i,'school','Fees'],
  [/pharmac|chemist|drug/i,'health','Pharmacy'],[/hospital|clinic|medical|lab\b/i,'health','Clinic/hospital'],[/\bnhis\b/i,'health','NHIS'],
  [/susu/i,'susu','Susu'],[/saving|investment|t-?bill/i,'susu','Savings'],
  [/\brent\b|landlord/i,'rent','Rent'],
  [/kfc|pizza|restaurant|chop ?bar|eatery|papaye|chicken|waakye|jollof|food|canteen/i,'food','Eating out'],[/shoprite|melcom|maxmart|market|grocer|supermarket|china mall|palace/i,'food','Market & groceries'],
  [/barber|salon|hair/i,'personal','Barber/salon'],[/cloth|fashion|boutique|shoe/i,'personal','Clothes'],
];
function parseSms(raw){
  const text=String(raw||'').replace(/\s+/g,' ').trim();
  if(!text)return null;
  const low=text.toLowerCase();
  const wallet=/telecel|vodafone|vodacash/i.test(text)?'telecel':/at ?money|airteltigo|airtel ?tigo/i.test(text)?'at':'mtn';
  // money mentions with their context
  const re=/(?:GHS|GH₵|GH¢|GHC|¢|Cedis?)\s?:?\s*([\d,]+(?:\.\d{1,2})?)|([\d,]+\.\d{2})\s*(?:GHS|GH₵|GHC|cedis?)/gi;
  let m,main=null,bal=null,fee=0;
  while((m=re.exec(text))){
    const val=toPes((m[1]||m[2]).replace(/,/g,''));
    const ctx=low.slice(Math.max(0,m.index-32),m.index);
    if(/bal(ance)?\b|bal:|bal\.|new bal/.test(ctx.slice(-22))){if(bal===null)bal=val;}
    else if(/fee|charge|commission/.test(ctx.slice(-22)))fee+=val;
    else if(/tax|levy/.test(ctx.slice(-22)))fee+=val;
    else if(main===null)main=val;
  }
  if(!main)return {error:'Couldn’t find an amount. Check you copied the whole message.'};
  let type='spend';
  if(/cash ?out|withdraw/.test(low))type='cashout';
  else if(/cash ?in\b|cash-in|deposit (made|of|received|successful)/.test(low)&&!/received from|from .* (sent|transferred)/.test(low))type='cashin';
  else if(/payment received|you have received|you received|received (ghs|gh₵|ghc|gh¢|¢)|has been credited|credited to your|cash ?in|deposit (made|of|received|successful)|transfer(red)? from/.test(low))type='in';
  const stop='(?=\\s*(?:\\.|,|;|\\bcurrent\\b|\\bon\\b|\\bat\\b|\\bref|\\bwith\\b|\\btransaction\\b|\\bfinancial\\b|\\bhas\\b|\\bwas\\b|\\bis\\b|\\bavailable\\b|\\bfee\\b|\\btax\\b|\\(|\\d{6,}|$))';
  const who=type==='in'?new RegExp('\\bfrom\\s+(?:\\+?\\d[\\d ]{8,}\\s+)?([A-Za-z][A-Za-z0-9 .&\'/-]{1,40}?)'+stop,'i'):new RegExp('\\bto\\s+(?:\\+?\\d[\\d ]{8,}\\s+)?([A-Za-z][A-Za-z0-9 .&\'/-]{1,40}?)'+stop,'i');
  let payee='';const pm=text.match(who);if(pm)payee=titleCase(pm[1].replace(/\s+(your|the)\s*$/i,'').trim());
  if(/^(your|you|account|wallet|momo|mobile money)$/i.test(payee))payee='';
  let ref='';const rm=text.match(/reference:?\s*([^.\n;]{1,60})/i);if(rm){ref=rm[1].replace(/\b(transaction|financial|fee|tax).*$/i,'').trim();if(/^\W*\d{0,2}\W*$|^n\/?a$|^none$/i.test(ref))ref='';}
  let date=ymd(new Date());
  let dm=text.match(/(20\d{2})-(\d{2})-(\d{2})/);
  if(dm)date=dm[1]+'-'+dm[2]+'-'+dm[3];
  else if((dm=text.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](20\d{2}|\d{2})\b/))){const y=dm[3].length===2?'20'+dm[3]:dm[3];date=y+'-'+pad(dm[2])+'-'+pad(dm[1]);}
  if(date>ymd(new Date())||isNaN(parse(date)))date=ymd(new Date());
  // guess category: what you used for this payee before, else keywords
  let cat='',sub='';
  if(payee){const prev=state.exp.filter(e=>e.payee&&e.payee.toLowerCase()===payee.toLowerCase()).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0];if(prev){cat=prev.cat;sub=prev.sub||'';}}
  if(!cat){const hay=payee+' '+ref+' '+text;for(const [k,c,s] of KEYWORDS)if(k.test(hay)){cat=c;sub=s;break;}}
  const salary=/salary|payroll|wages/i.test(text);
  return {type,amount:main,fee,bal,wallet,payee,ref,date,cat,sub,salary};
}
function openSms(){
  sheetShell('Paste a MoMo SMS',
    '<p class="note" style="margin:0">Open your messages, press and hold the MoMo message, tap Copy, then paste it below. Works with MTN MoMo, Telecel Cash and AT Money messages.</p>'+
    '<textarea id="smsIn" rows="6" placeholder="Paste the message here" aria-label="MoMo message"></textarea>'+
    '<div id="smsOut"></div>',null,'','Read message');
  const out=()=>{
    const r=parseSms($('#smsIn').value);$('#err').hidden=true;
    if(!r){$('#smsOut').innerHTML='';return null;}
    if(r.error){$('#smsOut').innerHTML='';showErr(r.error);return null;}
    const label=r.type==='in'?'Money in':r.type==='cashout'?'Cash-out (MoMo → Cash)':r.type==='cashin'?'Cash-in (Cash → '+METH[r.wallet].name+')':'Spending';
    const wal=walletBalances();
    let h='<div class="smscard"><div class="smst">'+label+'</div><div class="smsamt num'+(r.type==='in'?' in':'')+'">'+(r.type==='in'?'+':'')+cedi(r.amount)+'</div><dl>'+
      (r.payee?'<dt>'+(r.type==='in'?'From':'To')+'</dt><dd>'+esc(r.payee)+'</dd>':'')+
      (r.ref?'<dt>Reference</dt><dd>'+esc(r.ref)+'</dd>':'')+
      (r.fee?'<dt>Fee / tax</dt><dd class="num">'+cedi(r.fee)+'</dd>':'')+
      '<dt>Wallet</dt><dd>'+esc(METH[r.wallet].name)+'</dd><dt>Date</dt><dd>'+fmtD(parse(r.date))+'</dd>'+
      (r.type==='spend'&&r.cat?'<dt>Category</dt><dd>'+esc(CAT[r.cat].name)+(r.sub?' › '+esc(r.sub):'')+'</dd>':'')+
      (r.bal!=null?'<dt>Balance in SMS</dt><dd class="num">'+cedi(r.bal)+'</dd>':'')+'</dl>';
    if(r.bal!=null){const delta=(r.type==='in'||r.type==='cashin')?r.amount-r.fee:-(r.amount+r.fee);const after=(wal[r.wallet]||0)+delta;
      if(Math.abs(after-r.bal)>=1)h+='<p class="note" style="margin:0;color:var(--warn)">After this, Pocket Cedi would show '+cedi(after)+' on '+esc(METH[r.wallet].name)+'. You can match it to the message on the next step.</p>';
      else h+='<p class="note" style="margin:0;color:var(--ok)">Your '+esc(METH[r.wallet].name)+' balance will match the message.</p>';}
    const ml=r.type==='in'?findLoan(r.payee,'lent'):r.type==='spend'?findLoan(r.payee,'borrowed'):null;
    if(ml)h+='<div class="loanhint"><span>'+(r.type==='in'?'Is this <b>'+esc(ml.person)+'</b> paying you back? They owe you '+cedi(owedOf(ml))+'.':'Are you paying back <b>'+esc(ml.person)+'</b>? You owe '+cedi(owedOf(ml))+'.')+'<button type="button" class="btn sm2" data-as="repay:'+esc(ml.id)+'">Yes, record repayment</button></div>';
    h+='<p class="note" style="margin:0">Wrong type? <button type="button" class="linkbtn" data-as="spend">Spending</button> · <button type="button" class="linkbtn" data-as="in">Money in</button> · <button type="button" class="linkbtn" data-as="cashout">Cash-out</button> · <button type="button" class="linkbtn" data-as="cashin">Cash-in</button> · <button type="button" class="linkbtn" data-as="'+(r.type==='in'?'borrow':'lend')+'">'+(r.type==='in'?'I borrowed it':'I lent it')+'</button></p></div>';
    $('#smsOut').innerHTML=h;$('#saveBtn').textContent='Continue';return r;
  };
  let parsed=null;
  $('#smsIn').addEventListener('input',()=>{parsed=out();});
  $('#smsIn').addEventListener('paste',()=>setTimeout(()=>{parsed=out();},0));
  setTimeout(()=>$('#smsIn')&&$('#smsIn').focus(),60);
  const go=(r,as)=>{
    const t=as||r.type, o={fromSms:true,smsWallet:r.wallet,smsBal:r.bal,fee:r.fee};
    if(t.startsWith('repay:')){const l=state.loans.find(x=>x.id===t.slice(6));if(l)openRepay(l,Object.assign(o,{prefill:{amount:Math.min(r.amount,owedOf(l)),wallet:r.wallet,date:r.date}}));return;}
    if(t==='lend'||t==='borrow'){openLoan(null,Object.assign(o,{prefill:{dir:t==='lend'?'lent':'borrowed',amount:r.amount,person:shortName(r.payee),payee:r.payee,wallet:r.wallet,date:r.date,note:'',due:''}}));return;}
    if(t==='in')openIn(null,Object.assign(o,{prefill:{amount:r.amount,source:r.salary?'salary':'other',to:r.wallet,note:[r.payee,r.ref].filter(Boolean).join(' – '),date:r.date}}));
    else if(t==='cashin')openMove(null,Object.assign(o,{prefill:{amount:r.amount,from:'cash',to:r.wallet,note:'Cash-in'+(r.payee?' at '+r.payee:''),date:r.date}}));
    else if(t==='cashout')openMove(null,Object.assign(o,{prefill:{amount:r.amount,from:r.wallet,to:'cash',note:'Cash-out'+(r.payee?' at '+r.payee:''),date:r.date}}));
    else openSpend(null,Object.assign(o,{prefill:{amount:r.amount,cat:r.cat,sub:r.sub,method:r.wallet,note:r.ref&&r.payee?r.payee+' – '+r.ref:(r.payee||r.ref),payee:r.payee,date:r.date,tags:[]}}));
  };
  $('#smsOut').onclick=e=>{const b=e.target.closest('[data-as]');if(b&&parsed&&!parsed.error)go(parsed,b.dataset.as);};
  $('#sheet').onsubmit=e=>{e.preventDefault();parsed=out();if(parsed&&!parsed.error){if($('#saveBtn').dataset.ready)go(parsed);else{$('#saveBtn').dataset.ready='1';go(parsed);}}else if(!parsed)showErr('Paste a MoMo message first.');};
}

/* ---------- loans ---------- */
const paidOf=l=>(l.payments||[]).reduce((a,p)=>a+(p.amount||0),0);
const owedOf=l=>l.closed?0:Math.max(0,(l.amount||0)-paidOf(l));
const openLoans=()=>state.loans.filter(l=>owedOf(l)>0);
function loanTotals(){let owed=0,owe=0;for(const l of state.loans){const o=owedOf(l);if(l.dir==='lent')owed+=o;else owe+=o;}return {owed,owe};}
const shortName=n=>{const w=String(n||'').trim().split(/\s+/).filter(Boolean);return w.length>2?w[0]+' '+w[w.length-1]:w.join(' ');};
const initials=n=>String(n||'?').trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('')||'?';
const words=n=>String(n||'').toLowerCase().split(/[^a-z]+/).filter(w=>w.length>2);
function findLoan(name,dir){const nw=words(name);if(!nw.length)return null;return openLoans().filter(l=>l.dir===dir).find(l=>{const lw=words(l.person+' '+(l.payee||''));return nw.some(w=>lw.includes(w));})||null;}
function dueState(l){if(!l.due||owedOf(l)<=0)return null;const t=ymd(new Date());if(l.due<t)return 'over';const soon=ymd(addDays(new Date(),3));return l.due<=soon?'soon':'later';}
function loanRow(l){
  const o=owedOf(l),p=paidOf(l),ds=dueState(l);
  const verb=l.dir==='lent'?'You lent':'You borrowed';
  const sub=verb+' '+fmtD(parse(l.date))+(l.due?' · due '+fmtD(parse(l.due)):'');
  const pill=ds==='over'?'<span class="pill bad">Overdue</span>':ds==='soon'?'<span class="pill warn">Due soon</span>':o<=0?'<span class="pill okp">'+(l.closed&&p<l.amount?'Settled':'Paid')+'</span>':'';
  return '<button class="row" data-loan="'+esc(l.id)+'"><div class="dot sm av '+(l.dir==='lent'?'av-lent':'av-borr')+'">'+esc(initials(l.person))+'</div><div class="t"><div>'+esc(l.person)+pill+'</div><small>'+esc(sub)+'</small></div><div class="a '+(o<=0?'mv':l.dir==='lent'?'in':'owe')+'">'+cedi(o>0?o:l.amount)+(o>0&&p>0?'<small class="of">of '+cediShort(l.amount)+'</small>':'')+'</div></button>';
}
function loansCard(){
  const open=openLoans();if(!open.length)return '';
  const t=loanTotals();
  return '<section class="card"><div class="ch"><h2>Loans</h2><button class="linkbtn" data-act="loans">See all</button></div>'+
    '<div class="loansum"><div><span>Owed to you</span><b class="num inok">'+cedi(t.owed)+'</b></div><div><span>You owe</span><b class="num owe">'+cedi(t.owe)+'</b></div></div>'+
    '<div class="day">'+open.sort((a,b)=>(a.due||'9')<(b.due||'9')?-1:1).slice(0,3).map(loanRow).join('')+'</div></section>';
}
function loansView(){
  const t=loanTotals(),open=openLoans(),done=state.loans.filter(l=>owedOf(l)<=0).sort((a,b)=>b.date.localeCompare(a.date));
  let h=modeNote()+'<section class="card"><div class="ch"><h2>Loans</h2></div><div class="loansum"><div><span>Owed to you</span><b class="num inok">'+cedi(t.owed)+'</b></div><div><span>You owe</span><b class="num owe">'+cedi(t.owe)+'</b></div></div>'+
    '<div class="btns"><button class="btn" data-act="lend">+ I lent money</button><button class="btn ghost" data-act="borrow">+ I borrowed</button></div>'+
    '<p class="note" style="margin:0">Loans move money in and out of your wallets, but they don’t count as spending or income.</p></section>';
  if(!state.loans.length)return h+'<section class="card"><div class="empty"><strong>No loans yet</strong>When you lend money to a friend or borrow some, add it here. You’ll see who still owes what, and when it’s due.</div></section>';
  const lent=open.filter(l=>l.dir==='lent'),borr=open.filter(l=>l.dir==='borrowed');
  if(lent.length)h+='<section class="card" style="gap:4px"><div class="ch"><h2>Owed to you</h2><span class="sub">'+lent.length+' open</span></div><div class="day">'+lent.map(loanRow).join('')+'</div></section>';
  if(borr.length)h+='<section class="card" style="gap:4px"><div class="ch"><h2>You owe</h2><span class="sub">'+borr.length+' open</span></div><div class="day">'+borr.map(loanRow).join('')+'</div></section>';
  if(done.length)h+='<section class="card" style="gap:4px"><div class="ch"><h2>Settled</h2></div><div class="day">'+done.slice(0,15).map(loanRow).join('')+'</div></section>';
  return h;
}
function openLoan(item,opts){
  opts=opts||{};
  const it=item||Object.assign({dir:'lent',amount:0,person:'',wallet:'mtn',date:ymd(new Date()),due:'',note:''},opts.prefill||{});
  let dir=it.dir,wallet=it.wallet;
  const people=[...new Set(state.loans.map(l=>l.person))];
  sheetShell(item?'Edit loan':(dir==='lent'?'I lent money':'I borrowed money'),
    (item?'':chipGroup('Which way?','dirChips','d',[{id:'lent',name:'I lent money'},{id:'borrowed',name:'I borrowed money'}],dir))+
    amountField(it.amount)+
    '<div class="field"><label for="person" id="personLbl">'+(dir==='lent'?'Who did you lend to?':'Who did you borrow from?')+'</label><input type="text" id="person" list="peopleList" maxlength="40" placeholder="e.g. Kofi" value="'+esc(it.person)+'"><datalist id="peopleList">'+people.map(p=>'<option value="'+esc(p)+'">').join('')+'</datalist></div>'+
    '<div id="walWrap">'+chipGroup(dir==='lent'?'Paid from':'Received into','walChips','w',METHODS,wallet)+'</div>'+

function openRepay(l,opts){

    '<div class="field"><label for="date">Date</label><input type="date" id="date" value="'+esc(pf.date||ymd(new Date()))+'"></div>'+balanceCheck(opts),
    null,'','Save repayment');

  $('#sheet').onsubmit=async e=>{
    e.preventDefault();

    if(amount<=0)return showErr('Enter the amount repaid.');
    if(amount>o)return showErr('That’s more than the '+cedi(o)+' still owed. Check the amount.');
    const date=$('#date').value||ymd(new Date());
    const pay={id:'p'+uid(),amount,wallet,date,createdAt:Date.now()};
    const walBefore=walletBalances();
    $('#saveBtn').disabled=true;
    try{await saveDoc('loan',l.id,Object.assign({},stripId(l),{payments:(l.payments||[]).concat(pay)}));
      if(wallet===opts.smsWallet)await applyBalance(opts,walBefore,lent?amount:-amount,date);
      closeSheet();
      const full=amount===o;
      toast(full?(lent?l.person+' has paid you back in full':'You’ve paid '+l.person+' back in full'):(lent?l.person+' still owes ':'You still owe ')+(full?'':cedi(o-amount)),{label:'Undo',fn:async()=>{const cur=state.loans.find(x=>x.id===l.id);if(cur){await saveDoc('loan',l.id,Object.assign({},stripId(cur),{payments:(cur.payments||[]).filter(x=>x.id!==pay.id)}));toast('Removed');}}});

  };
}

const BK='pocketcedi.lastBackup';
function lastBackup(){try{return Number(localStorage.getItem(BK))||0;}catch(e){return 0;}}
async function saveFile(name,data,type){
  const blob=new Blob([data],{type});
  try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return;}}
  catch(e){if(e&&e.name==='AbortError')throw {code:'declined'};}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}

    try{localStorage.setItem(BK,String(Date.now()));}catch(e){}render();toast('Backup saved');}

    box.innerHTML='<div class="confirm">Replace everything on this phone with the backup from '+esc(when)+'? It has '+n+' entr'+(n===1?'y':'ies')+'.<div class="btns"><button type="button" class="btn ghost" id="rsNo">Cancel</button><button type="button" class="btn" id="rsYes">Replace</button></div></div>';

    rows.sort((a,b)=>b[0].localeCompare(a[0]));
    const csv='Date,Type,Amount (GHS),Category or source,Detail,From wallet,To wallet,Payee,Note,Tags\n'+rows.map(r=>r.map(q).join(',')).join('\n');
    await saveFile('pocket-cedi-'+ymd(new Date())+'.csv',csv,'text/csv');toast('Export ready');

  const mn=e.target.closest('[data-money]');if(mn){const it=state.money.find(x=>x.id===mn.dataset.money);if(it)(it.kind==='move'?openMove:openIn)(it);return;}
  const op=e.target.closest('[data-open]');if(op){state.open[op.dataset.open]=!state.open[op.dataset.open];render();return;}
  const tg=e.target.closest('[data-tag]');if(tg){state.search='#'+tg.dataset.tag;state.tab='entries';render();window.scrollTo(0,0);return;}
  const dq=e.target.closest('[data-delquick]');if(dq){try{await saveSettings({quick:state.settings.quick.filter(x=>x.id!==dq.dataset.delquick)});toast('Quick button removed');}catch(err){toast('Could not remove. Try again.');}return;}
  const ds=e.target.closest('[data-delsub]');if(ds){const [k,s]=ds.dataset.delsub.split('|');const sc=Object.assign({},state.settings.subcats);sc[k]=(sc[k]||[]).filter(x=>x!==s);try{await saveSettings({subcats:sc});toast('Removed');}catch(err){toast('Could not remove. Try again.');}return;}
  const a=e.target.closest('[data-act]');if(a){const v=a.dataset.act;
    if(v==='in')openIn(null);else if(v==='move')openMove(null);else if(v==='sms')openSms();
    else if(v==='backup')backupNow();
    else if(v==='tour')openGuide(0);
    else if(v==='video')openVideo();
    else if(v==='restore')startRestore();
    else if(v==='lend'||v==='borrow')openLoan(null,{prefill:{dir:v==='lend'?'lent':'borrowed'}});
    else if(v==='loans'){state.tab='loans';render();window.scrollTo(0,0);}
    else if(v==='editquick'){state.tab='budgets';render();setTimeout(()=>{const el=$('#quickSetup');if(el)el.scrollIntoView({block:'start'});},30);}
    return;}
  if(e.target.id==='exportBtn')exportCSV();
});
$('#main').addEventListener('change',e=>{if(e.target.id==='restoreFile'&&e.target.files&&e.target.files[0])readRestore(e.target.files[0]);});
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
init();
})();
</script>

</body>
</html>
